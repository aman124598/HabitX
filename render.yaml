services:
  - type: web
    name: habitx-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: yarn --frozen-lockfile install
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://habitx.onrender.com
      - key: ALLOWED_ORIGINS
        value: "*"
      # Set secrets in Render dashboard — do not commit values
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
